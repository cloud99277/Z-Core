[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zcore"
version = "0.2.0"
description = "Z-Core — Agent runtime middleware for shared memory, context management, and skill orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zcore = "zcore.cli.main:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["zcore*"]

[tool.setuptools.package-data]
"zcore.prompts" = ["*.md"]
